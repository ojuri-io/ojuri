worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Upstream configuration for RDA services
    upstream rda_backend {
        least_conn;
        keepalive 32;

        server rda-1:3000 max_fails=3 fail_timeout=30s;
        server rda-2:3000 max_fails=3 fail_timeout=30s;
        server rda-3:3000 max_fails=3 fail_timeout=30s;
    }

    # Note: PAA services are standalone Kafka consumers
    # They expose metrics on port 9090 but don't serve API requests

    server {
        listen 80;
        server_name _;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://rda_backend/livez;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Readiness check endpoint
        location /ready {
            proxy_pass http://rda_backend/readyz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Main fraud prediction endpoint
        location /v1/predict {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts optimized for low latency
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 200ms;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Metrics endpoint
        location /v1/metrics {
            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Root endpoint
        location / {
            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Status page for monitoring
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
