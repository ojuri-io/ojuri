worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Upstream configuration for RDA services. Docker DNS returns one
    # A record per replica (RDA_REPLICAS in docker-compose.yml) and
    # nginx expands them into separate peers at startup — restart nginx
    # after scaling so it re-resolves.
    upstream rda_backend {
        least_conn;
        keepalive 32;

        server rda:3000 max_fails=3 fail_timeout=30s;
    }

    # Docker's embedded DNS resolver. Lets us defer FIA hostname
    # resolution until request time — without this nginx hard-fails
    # at startup whenever FIA isn't running (e.g. the default
    # `docker compose up`, since FIA is gated behind a profile).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Note: PAA services are standalone Kafka consumers
    # They expose metrics on port 9090 but don't serve API requests

    server {
        listen 80;
        server_name _;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://rda_backend/livez;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Readiness check endpoint
        location /ready {
            proxy_pass http://rda_backend/readyz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Main fraud prediction endpoint
        location /v1/predict {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Connection timeouts. The 4 ms p99 quoted in docs is the
            # in-process latency; the end-to-end path through NGINX +
            # Redis + Postgres on a cold cache routinely takes longer
            # than 200 ms (the previous value), which produced
            # spurious 504s while the audit row + Kafka publish had
            # already happened on the RDA side — phantom decisions
            # the caller never saw. 10 s matches proxy_send_timeout
            # and gives realistic headroom.
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Metrics endpoint
        location /v1/metrics {
            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # FIA HTTP API proxy. The Sentinel dashboard calls `/fia/v1/...`
        # via this same path in production (the Vite dev server proxies
        # the same prefix). LLM generation runs at seconds-per-request,
        # so the read timeout is generous.
        #
        # `$fia_upstream` deliberately holds the hostname as a variable
        # so nginx re-resolves it via the Docker resolver per request,
        # instead of failing at startup when FIA isn't running (the
        # service is gated behind the `fia` Compose profile). When FIA
        # is down, callers get a 502 — which is correct.
        location /v1/admin/training/upload {
            client_max_body_size 8m;
            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # MLA service runs natively on the host (not in compose) — proxy
        # the Sentinel "retrain now" + drift-config calls through.
        # Variable in proxy_pass defers DNS to request time, otherwise
        # nginx hard-fails at startup on hosts that don't resolve
        # host.docker.internal (e.g. CI without extra_hosts wired up).
        location /mla/ {
            set $mla_upstream host.docker.internal;
            proxy_pass http://$mla_upstream:9095/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }

        location /fia/ {
            set $fia_upstream fia;
            proxy_pass http://$fia_upstream:9094/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }

        # Root endpoint
        location / {
            proxy_pass http://rda_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Status page for monitoring
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
