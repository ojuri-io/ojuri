global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # RDA Service metrics. DNS service discovery follows RDA_REPLICAS —
  # each replica's A record becomes a target, re-resolved every 30 s,
  # so scaling needs no Prometheus config change. Instance labels are
  # replica IPs (stable names aren't available from Docker DNS).
  - job_name: "rda"
    metrics_path: /v1/metrics
    dns_sd_configs:
      - names: ["rda"]
        type: A
        port: 3000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "$1"

  # PAA Service metrics (singleton — see docker-compose.yml).
  - job_name: "paa"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "paa-1:9090"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "$1"

  # Redis metrics (requires redis_exporter)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Nginx metrics (requires nginx-prometheus-exporter)
  # - job_name: "nginx"
  #   static_configs:
  #     - targets: ["nginx-exporter:9113"]
