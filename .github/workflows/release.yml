name: Release

# Triggered when a tag matching v* is pushed. By convention we tag
# from main after a PR merges; everything before this point should
# already have passed CI via the regular `push` trigger on main.
# The jobs below re-test, build images for the five published
# services, push to GHCR with both an exact-version tag and a
# floating major tag (so adopters who pin to `:v1` receive minors
# automatically — see VERSIONING.md), and create a GitHub Release
# with auto-generated notes from the merged PRs since the previous
# tag.

on:
  push:
    tags:
      - "v*"
  # Manual trigger lets maintainers run the full pipeline against a
  # branch without tagging — useful for verifying the workflow itself
  # before the first real release, and as a permanent escape hatch
  # for re-running a failed release without retagging. The `dry_run`
  # flag (default true on manual runs, irrelevant on tag pushes)
  # skips the GHCR push and the GitHub Release create steps so a
  # manual run produces no public artefacts.
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to render (e.g. v1.0.0). Used only to validate parsing and to tag the built-but-not-pushed images in logs."
        required: true
        type: string
      dry_run:
        description: "Skip GHCR push + GitHub Release create. Leave checked for verification runs."
        required: false
        default: true
        type: boolean

# A given tag should only ever produce one release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ojuri-io

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Derive the version (vX.Y.Z) and the floating major (vX) once,
  # so the downstream matrix jobs don't re-parse the ref each time.
  # ─────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      major: ${{ steps.parse.outputs.major }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag/version '$TAG' is not SemVer (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          MAJOR=$(echo "$TAG" | sed -E 's/^v([0-9]+)\..*/v\1/')
          echo "version=$TAG"  >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"  >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Fast feedback: lint + test + build for each TS/JS workspace.
  # Mirrors the matrix in ci.yml so the release workflow re-verifies
  # the tagged commit independently of whatever ran on main earlier.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: ${{ matrix.workspace }} · lint + test + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: root
            dir: .
          - workspace: paa-service
            dir: paa-service
          - workspace: frontend
            dir: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # Integration smoke: bring the stack up against real Postgres +
  # Kafka + Redis in compose, run migrations, hit /v1/predict end to
  # end. Cheaper than CI's full smoke matrix — release CI's job is
  # "the tagged commit hasn't broken the happy path", not full
  # regression coverage, which already ran on the merge that
  # produced this commit.
  # ─────────────────────────────────────────────────────────────────
  integration-smoke:
    name: docker stack smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure .env for the smoke run
        run: |
          cp .env.example .env
          # The compose stack requires a non-default JWT secret to start.
          sed -i 's|^AUTH_JWT_SECRET=.*|AUTH_JWT_SECRET=release-smoke-secret-padding-padding-padding|' .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Boot the stack
        run: docker compose up -d --build --wait

      - name: Wait for nginx /health
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost/health >/dev/null; then
              echo "nginx healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::nginx /health never came up"
          docker compose ps
          docker compose logs --tail 100
          exit 1

      # Migrations now run as a Compose one-shot `db-migrate` service before
      # RDA accepts traffic (depends_on: service_completed_successfully). The
      # prior host-side `npm run db:migrate` step here conflicted with that —
      # the container had already recorded .js filenames in the migrations
      # table, and the host run then errored with "migration directory is
      # corrupt" looking for files that exist as .ts in src/.

      - name: Smoke /v1/predict end-to-end
        run: |
          TS=$(python3 -c 'import time; print(int(time.time()*1000))')
          curl -fsS -X POST http://localhost/v1/predict \
            -H "Content-Type: application/json" \
            -d "{\"transaction_id\":\"release-smoke-${GITHUB_SHA}\",\"sender_id\":\"smoke-s\",\"receiver_id\":\"smoke-r\",\"amount\":1234,\"transaction_type\":\"TRANSFER\",\"timestamp\":$TS}" \
            | tee /tmp/predict.json
          grep -q '"decision"' /tmp/predict.json

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────
  # Build + push the five service images to GHCR. Each is tagged
  # with the exact version (vX.Y.Z) and the floating major (vX);
  # adopters pinned to :v1 in their compose file receive the patch
  # the next time they `docker compose pull`.
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [resolve-version, test, integration-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rda
            context: .
            dockerfile: Dockerfile
          - image: paa
            context: paa-service
            dockerfile: paa-service/Dockerfile
          - image: mla
            context: mla-service
            dockerfile: mla-service/Dockerfile
          - image: fia
            context: fia-service
            dockerfile: fia-service/Dockerfile
          - image: sentinel
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # QEMU registers linux/arm64 (and others) as a buildable target on the
      # x86_64 GitHub runner via binfmt_misc. Without it, `buildx build
      # --platform linux/arm64` errors with "exec format error" when it
      # tries to RUN apt/npm/pip inside the arm64 base image.
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ (github.event_name == 'push' || !inputs.dry_run) && ' + push' || ' (dry-run, no push)' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # linux/amd64 is the canonical adopter target (most Linux servers,
          # GitHub Actions runners, Docker Desktop on Intel Macs).
          # linux/arm64 covers Apple Silicon (M-series), AWS Graviton,
          # Ampere, Oracle Ampere A1, and various ARM cloud VMs. Without
          # this, adopters on ARM hosts hit
          # `no matching manifest for linux/arm64/v8` on `docker pull`.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || !inputs.dry_run }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.resolve-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.resolve-version.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ─────────────────────────────────────────────────────────────────
  # Cut the GitHub Release. Notes are auto-generated from PRs and
  # commits since the previous tag; the release maintainer can edit
  # the body afterwards if they want to add a narrative section.
  # ─────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-version, build-and-push]
    # Dry-run manual runs skip the Release create — they exist to
    # validate the test + build path without producing public
    # artefacts. Real tag pushes always create the Release.
    if: github.event_name == 'push' || !inputs.dry_run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If the release ships raw SQL migrations under
      # migrations/v<version>/*.sql (a convention reserved for
      # major upgrades that need adopter-side data work), pick them
      # up here as release assets. Patch and minor releases don't
      # use this directory; the Knex-managed migrations under
      # src/database/migrations/ ship inside the published images
      # and run automatically.
      - name: Collect SQL migrations (if present)
        id: migrations
        run: |
          DIR="migrations/${{ needs.resolve-version.outputs.version }}"
          if [ -d "$DIR" ] && compgen -G "$DIR/*.sql" >/dev/null; then
            ls -1 "$DIR"/*.sql
            echo "files<<EOF"        >> "$GITHUB_OUTPUT"
            ls -1 "$DIR"/*.sql       >> "$GITHUB_OUTPUT"
            echo "EOF"               >> "$GITHUB_OUTPUT"
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migrations directory at $DIR — skipping."
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: ${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.migrations.outputs.has_migrations == 'true' && steps.migrations.outputs.files || '' }}
          body: |
            Released by the [`release.yml`](.github/workflows/release.yml) workflow.

            **Published images** (pull with `:${{ needs.resolve-version.outputs.major }}` for floating-major pinning, or `:${{ needs.resolve-version.outputs.version }}` to pin the exact build):

            - `ghcr.io/ojuri-io/rda`
            - `ghcr.io/ojuri-io/paa`
            - `ghcr.io/ojuri-io/mla`
            - `ghcr.io/ojuri-io/fia`
            - `ghcr.io/ojuri-io/sentinel`

            See [`CHANGELOG.md`](CHANGELOG.md) for the human-curated change log, [`VERSIONING.md`](VERSIONING.md) for the pinning recommendation, and [`UPGRADING.md`](UPGRADING.md) for any major-version upgrade path.
